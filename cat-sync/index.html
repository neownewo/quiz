const pick=()=>{let options=MCQ.map((_,i)=>i).filter(i=>!used.includes(i));if(!options.length)throw Error('題庫已用完');let idx=options[Math.floor(Math.random()*options.length)];used.push(idx);return MCQ[idx]};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function send(event,payload){if(!channel)return;await channel.send({type:'broadcast',event,payload:{...payload,from:myId}})}
function renderMembers(){let arr=Object.values(members);$('members').innerHTML=arr.map(p=>'<div class="player">'+safe(p.name)+(p.id===hostId?' 👑':'')+'</div>').join('');show('start',host&&arr.length>=2);show('hostSettings',host&&!round);$('roundSettings').textContent='本局 '+totalRounds+' 題 · 每題 30 秒';$('progress').textContent=Object.keys(answers).length+' / '+arr.length+' 人已作答';}
function broadcastState(){if(host)send('state',{members:Object.values(members),hostId,round,question,questionOptions,totalRounds,deadline,answers,revealed,history,currentVersion})}
function render(){show('setup',false);show('lobby',!round);show('game',!!round);$('roomCode').textContent=room;$('share').textContent=location.origin+'/cat-sync/?room='+room;renderMembers();if(!round)return;$('round').textContent='第 '+round+' / '+totalRounds+' 題';$('question').textContent=question;let submitted=Object.hasOwn(answers,myId);show('answerArea',!revealed&&!submitted);$('choices').innerHTML=questionOptions.map((v,i)=>'<button class="choice" data-index="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+safe(v)+'</button>').join('');$('choices').querySelectorAll('button').forEach(btn=>btn.onclick=()=>submitChoice(Number(btn.dataset.index)));$('progress').textContent=revealed?'本題答案已揭曉':submitted?'已送出！等待其他人或倒數結束…':Object.keys(answers).length+' / '+Object.keys(members).length+' 人已作答';show('revealArea',revealed);show('next',revealed&&host&&round<totalRounds);show('finish',revealed&&host&&round>=totalRounds);if(revealed){$('answers').innerHTML=Object.values(members).map(p=>'<div class="answer">'+safe(p.name)+'：<b>'+safe(answers[p.id]??'未作答')+'</b></div>').join('');let vals=Object.values(answers).map(x=>x.trim().toLocaleLowerCase());let count=Math.max(0,...[...new Set(vals)].map(v=>vals.filter(x=>x===v).length));$('match').textContent=count>=2?'✨ 最多 '+count+' 人同答案！':'這輪沒有同答案，下題再試！';}updateTimer()}
function updateTimer(){if(!round)return;let remaining=revealed?0:Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=revealed?'本題已結束':'⏱ 剩餘 '+remaining+' 秒';$('timer').classList.toggle('urgent',!revealed&&remaining<=10);if(host&&!revealed&&deadline&&Date.now()>=deadline)doReveal()}
function applyState(p){if(host||p.hostId!==hostId||p.currentVersion<currentVersion)return;currentVersion=p.currentVersion;members=Object.fromEntries(p.members.map(x=>[x.id,x]));round=p.round;question=p.question;questionOptions=p.questionOptions||[];totalRounds=p.totalRounds||10;deadline=p.deadline||0;answers=p.answers;revealed=p.revealed;history=p.history;render()}
function newRound(){if(round>=totalRounds)return;round++;let item=pick();question=item[0];questionOptions=item[1];answers={};revealed=false;deadline=Date.now()+30000;currentVersion++;broadcastState();render()}
function doReveal(){if(!host||revealed)return;revealed=true;let vals=Object.values(answers).map(x=>x.trim().toLocaleLowerCase());let best=Math.max(0,...[...new Set(vals)].map(v=>vals.filter(x=>x===v).length));history.push({question,answers:Object.values(members).map(p=>({name:p.name,answer:answers[p.id]||'未作答'})),best});currentVersion++;broadcastState();render()}
function submitChoice(index){if(revealed||!round||Date.now()>=deadline||Object.hasOwn(answers,myId))return;let answer=questionOptions[index];if(!answer)return;if(host){answers[myId]=answer;currentVersion++;if(Object.keys(answers).length>=Object.keys(members).length)doReveal();else{broadcastState();render()}}else{answers[myId]=answer;render();send('answer',{answer,round})}}
function normalizeAnswer(v){return String(v??'').normalize('NFKC').trim().replace(/\s+/g,'').toLocaleLowerCase('zh-Hant')}
function resultData(){
  const names=[...new Set(history.flatMap(h=>h.answers.map(a=>a.name)))];
  const pairs=[];
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){
    let same=0,total=0;
    for(const h of history){const a=h.answers.find(x=>x.name===names[i]),b=h.answers.find(x=>x.name===names[j]);
      if(!a||!b||!normalizeAnswer(a.answer)||!normalizeAnswer(b.answer)||a.answer==='未作答'||b.answer==='未作答')continue;
      total++;if(normalizeAnswer(a.answer)===normalizeAnswer(b.answer))same++;
    }
    if(total)pairs.push({a:names[i],b:names[j],same,total,rate:same/total});
  }
  const highest=pairs.length?Math.max(...pairs.map(p=>p.rate)):null;
  const lowest=pairs.length?Math.min(...pairs.map(p=>p.rate)):null;
  return {names,pairs,highest,lowest};
}
function pairText(p){return `${p.a} × ${p.b}　${Math.round(p.rate*100)}%（${p.same}/${p.total} 題）`}
function finish(){
  show('lobby',false);show('game',false);show('end',true);
  $('summary').textContent='共 '+history.length+' 輪｜'+history.filter(h=>h.best>=2).length+' 輪出現同詞相遇';
  const {names,pairs,highest,lowest}=resultData();
  let html='<div class="result-scroll"><table class="result-table"><thead><tr><th></th>'+names.map(n=>'<th>'+safe(n)+'</th>').join('')+'</tr></thead><tbody>';
  history.forEach((h,i)=>{const counts={};h.answers.forEach(a=>{let k=normalizeAnswer(a.answer);if(k&&a.answer!=='未作答')counts[k]=(counts[k]||0)+1});html+='<tr><td class="round-no">'+String(i+1).padStart(2,'0')+'</td>'+names.map(n=>{let a=h.answers.find(x=>x.name===n),v=a?.answer||'—',k=normalizeAnswer(v);return '<td class="'+(counts[k]>=2?'matched':'')+'">'+safe(v)+'</td>'}).join('')+'</tr>'});
  $('history').innerHTML=html+'</tbody></table></div>';
  const list=(items,low=false)=>items.length?items.map(p=>'<div class="pair-row '+(low?'low':'')+'"><span>'+safe(p.a)+' × '+safe(p.b)+'</span><strong>'+Math.round(p.rate*100)+'%（'+p.same+'/'+p.total+'）</strong></div>').join(''):'<p class="muted tiny">尚無可比較的共同作答紀錄</p>';
  $('pairs').innerHTML='<h3>💜 最有默契的組合</h3>'+list(pairs.filter(p=>p.rate===highest))+'<h3>🌿 最沒默契的組合</h3>'+list(pairs.filter(p=>p.rate===lowest),true);
}

async function connect(isHost){if(isHost && new URLSearchParams(location.search).has('room'))return notice('這是房間邀請連結，請加入房間',true);me=clean($('nickname').value);if(!me)return notice('請先輸入暱稱',true);room=isHost?Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join(''):clean($('roomInput').value).toUpperCase();if(!roomRegex.test(room))return notice('請輸入有效的 8 位房號',true);$('create').disabled=$('join').disabled=true;try{let res=await fetch('/api/cat-config');if(!res.ok)throw Error('讀取設定失敗');let config=await res.json();if(!config.url)throw Error('缺少原本的 SUPABASE_URL 設定');if(!config.publishableKey || !(config.publishableKey.startsWith('sb_publishable_') || config.publishableKey.startsWith('eyJ')))throw Error('請在 Vercel 設定 SUPABASE_PUBLISHABLE_KEY（公開金鑰）');client=supabase.createClient(config.url,config.publishableKey,{realtime:{params:{eventsPerSecond:10}}});host=isHost;hostId=host?myId:'';channel=client.channel('cat-sync-'+room,{config:{broadcast:{self:false},presence:{key:myId}}});channel.on('broadcast',{event:'hello'},({payload:p})=>{if(host){if(!members[p.from]){members[p.from]={id:p.from,name:clean(p.name)};currentVersion++;broadcastState();render()}else broadcastState()}}).on('broadcast',{event:'state'},({payload:p})=>{if(!host&&!hostId)hostId=p.hostId;applyState(p)}).on('broadcast',{event:'answer'},({payload:p})=>{if(!host||revealed||!round||Date.now()>=deadline||p.round!==round||!members[p.from]||Object.hasOwn(answers,p.from)||!questionOptions.includes(p.answer))return;answers[p.from]=p.answer;currentVersion++;if(Object.keys(answers).length>=Object.keys(members).length)doReveal();else{broadcastState();render()}}).on('broadcast',{event:'finish'},()=>finish()).on('broadcast',{event:'sync'},()=>{if(host)broadcastState()}).on('presence',{event:'leave'},({leftPresences})=>{if(!host)return;for(let p of leftPresences){if(p.user_id&&p.user_id!==myId)delete members[p.user_id]}currentVersion++;broadcastState();render()}).subscribe(async status=>{if(status==='SUBSCRIBED'&&!connected){connected=true;await channel.track({user_id:myId,name:me});if(host){members[myId]={id:myId,name:me};render();notice('房間已建立，分享連結給朋友！')}else{show('setup',false);show('lobby',true);notice('正在等待房主同步…');send('hello',{name:me});send('sync',{});setTimeout(()=>{if(!hostId)notice('尚未收到房主回應，請確認房號與房主是否在線',true)},4500)}}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')notice('即時連線失敗，請檢查 Supabase Realtime 設定',true)});}catch(e){notice(e.message,true);$('create').disabled=$('join').disabled=false}}
$('create').onclick=()=>connect(true);$('join').onclick=()=>connect(false);$('copy').onclick=async()=>{await navigator.clipboard.writeText(location.origin+'/cat-sync/?room='+room);notice('已複製邀請連結')};$('totalRounds').onchange=()=>{if(host&&!round){totalRounds=Number($('totalRounds').value);currentVersion++;broadcastState();render()}};$('start').onclick=()=>{if(host&&Object.keys(members).length>=2){totalRounds=Number($('totalRounds').value);newRound()}};$('next').onclick=()=>{if(host)newRound()};$('finish').onclick=()=>{if(host){send('finish',{});finish()}};timerHandle=setInterval(updateTimer,200);
$('download').onclick=()=>{
  const {names,pairs,highest,lowest}=resultData();
  const W=Math.max(850,170+names.length*180),scale=2,pad=45,numberW=48,colW=(W-pad*2-numberW)/Math.max(1,names.length);
  const ctx=document.createElement('canvas').getContext('2d');
  const measure=(txt,maxWidth,font)=>{ctx.font=font;const chars=Array.from(String(txt));let lines=[''];for(const ch of chars){let last=lines.length-1;if(ctx.measureText(lines[last]+ch).width>maxWidth&&lines[last])lines.push(ch);else lines[last]+=ch}return lines};
  const rowHeights=history.map(h=>Math.max(74,...names.map(n=>{let v=h.answers.find(x=>x.name===n)?.answer||'—';return 24+measure(v,colW-24,'bold 21px sans-serif').length*29})));
  const tops=[];let y=195;for(const h of rowHeights){tops.push(y);y+=h+10}
  const highs=pairs.filter(p=>p.rate===highest),lows=pairs.filter(p=>p.rate===lowest);
  const pairLine=(p)=>`${p.a} × ${p.b}　${Math.round(p.rate*100)}%（${p.same}/${p.total} 題）`;
  const pairRows=[...highs.map(p=>({text:pairLine(p),low:false})),...lows.map(p=>({text:pairLine(p),low:true}))];
  const pairY=y+65,footerY=pairY+90+pairRows.length*57+80;
  const H=Math.max(540,footerY);ctx.canvas.width=W*scale;ctx.canvas.height=H*scale;ctx.scale(scale,scale);
  ctx.fillStyle='#fbfafc';ctx.fillRect(0,0,W,H);
  function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function text(t,x,y,font,color,align='left'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
  function wrapped(t,x,cy,width,font,color,lineHeight){let ls=measure(t,width,font),start=cy-(ls.length-1)*lineHeight/2;ls.forEach((line,i)=>text(line,x,start+i*lineHeight,font,color,'center'))}
  text('我們的腦迴路',pad,62,'bold 36px sans-serif','#3f3a4c');text('共 '+history.length+' 輪 · '+history.filter(h=>h.best>=2).length+' 輪同詞相遇',W-pad,64,'19px sans-serif','#aaa3b2','right');
  names.forEach((n,i)=>wrapped(n,pad+numberW+(i+.5)*colW,142,colW-12,'bold 20px sans-serif','#8d8699',26));
  history.forEach((h,ri)=>{const counts={};h.answers.forEach(a=>{let k=normalizeAnswer(a.answer);if(k&&a.answer!=='未作答')counts[k]=(counts[k]||0)+1});const top=tops[ri],height=rowHeights[ri];text(String(ri+1).padStart(2,'0'),pad+5,top+height/2,'19px sans-serif','#a9a1b4');names.forEach((n,i)=>{let v=h.answers.find(x=>x.name===n)?.answer||'—',k=normalizeAnswer(v),x=pad+numberW+i*colW+5,w=colW-10;rect(x,top,w,height,18,i%2===0?'#eee7f7':'#def2ec');if(counts[k]>=2){ctx.strokeStyle='#b99edc';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x+1.5,top+1.5,w-3,height-3,17);ctx.stroke()}wrapped(v,x+w/2,top+height/2,w-24,'bold 21px sans-serif',i%2===0?'#765c98':'#548e7e',29)})});
  ctx.fillStyle='#e6e0ec';ctx.fillRect(pad,pairY-24,W-pad*2,1);
  let py=pairY;text('最有默契的成員組合',pad,py,'bold 24px sans-serif','#67518a');py+=39;
  if(!highs.length){text('尚無共同作答紀錄',pad+10,py,'19px sans-serif','#999');py+=48}else highs.forEach(p=>{rect(pad,py-18,W-pad*2,46,12,'#eee8f8');text(pairLine(p),pad+16,py+5,'19px sans-serif','#725991');py+=57});
  py+=15;text('最沒默契的成員組合',pad,py,'bold 24px sans-serif','#548b7c');py+=39;
  if(!lows.length){text('尚無共同作答紀錄',pad+10,py,'19px sans-serif','#999');py+=48}else lows.forEach(p=>{rect(pad,py-18,W-pad*2,46,12,'#e1f2ed');text(pairLine(p),pad+16,py+5,'19px sans-serif','#4d8676');py+=57});
  text('默契率＝同詞題數 ÷ 共同作答題數 · 同分並列',pad,H-35,'16px sans-serif','#aaa3b2');
  ctx.canvas.toBlob(blob=>{if(!blob)return notice('圖片產生失敗',true);const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='貓貓腦迴路-'+room+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)},'image/png');
};
