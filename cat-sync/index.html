function hashSeed(value){let h=2166136261;for(const ch of value){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function seededRandom(seed){let state=seed>>>0;return ()=>{state=(state+0x6D2B79F5)>>>0;let t=state;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function seededShuffle(items,rng){let arr=items.slice();for(let i=arr.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function optionsFor(item,id,roomCode){if(!item.dynamic)return item.options.slice();const rng=seededRandom(hashSeed([roomCode,item.id,BANK_VERSION].join('|')));const names=seededShuffle(TITLE_NAMES,rng);return item.dynamic.labels.map((title,i)=>title+'－'+names[i])}

const pick=()=>{let options=MCQ.map((_,i)=>i).filter(i=>!used.includes(i));if(!options.length)throw Error('題庫已用完');let idx=options[Math.floor(Math.random()*options.length)];used.push(idx);return {item:MCQ[idx],id:idx}};

function render(){show('setup',false);show('lobby',!round);show('game',!!round);$('roomCode').textContent=room;$('share').textContent=location.origin+'/cat-sync/?room='+room;renderMembers();if(!round)return;$('round').textContent='第 '+round+' / '+totalRounds+' 題';$('question').textContent=question;let submitted=Object.hasOwn(answers,myId);show('answerArea',!revealed&&!submitted);$('choices').innerHTML=questionOptions.map((v,i)=>'<button class="choice" data-index="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+safe(v)+'</button>').join('');$('choices').querySelectorAll('button').forEach(btn=>btn.onclick=()=>submitChoice(Number(btn.dataset.index)));$('progress').textContent=revealed?'本題答案已揭曉':submitted?'已送出！等待其他人或倒數結束…':Object.keys(answers).length+' / '+Object.keys(members).length+' 人已作答';show('revealArea',revealed);show('next',revealed&&host&&round<totalRounds);show('finish',revealed&&host&&round>=totalRounds);if(revealed){$('answers').innerHTML=Object.values(members).map(p=>'<div class="answer">'+safe(p.name)+'：<b>'+safe(answers[p.id]??'未作答')+'</b></div>').join('');let vals=Object.values(answers).map(x=>x.trim().toLocaleLowerCase());let count=Math.max(0,...[...new Set(vals)].map(v=>vals.filter(x=>x===v).length));$('match').textContent=count>=2?'✨ 最多 '+count+' 人同答案！':'這輪沒有同答案，下題再試！';}updateTimer()}

// 尚未取得 RTT 校時時，以房主廣播時間作初步估算，避免手機時鐘差造成只剩幾秒。
if(!clockReady&&Number.isFinite(p.hostSentAt))hostClockOffset=p.hostSentAt-Date.now();
const previousRound=round;currentVersion=p.currentVersion;members=Object.fromEntries(p.members.map(x=>[x.id,x]));round=p.round;question=p.question;questionOptions=p.questionOptions||[];questionId=Number.isInteger(p.questionId)?p.questionId:-1;questionDigest=p.questionDigest||'';if(questionId>=0&&MCQ[questionId]){let expected=optionsFor(MCQ[questionId],questionId,room);if(optionsHash(expected)!==questionDigest||JSON.stringify(expected)!==JSON.stringify(questionOptions)){notice('題目選項驗證失敗，請確認題庫版本一致並重新整理',true);return}}totalRounds=p.totalRounds||10;deadline=p.deadline||0;const pendingAnswer=previousRound===p.round&&!p.revealed&&Object.hasOwn(answers,myId)?answers[myId]:null;answers={...(p.answers||{})};if(pendingAnswer!==null&&!Object.hasOwn(answers,myId))answers[myId]=pendingAnswer;revealed=p.revealed;history=p.history||[];lastSyncAt=Date.now();if(syncRetryHandle){clearInterval(syncRetryHandle);syncRetryHandle=null}notice(round?'已同步房主題目，可以開始作答！':'已連上房主，等待開始遊戲');render()}
function newRound(){if(round>=totalRounds)return;round++;let picked=pick();questionId=picked.id;question=picked.item.question;questionOptions=optionsFor(picked.item,questionId,room);questionDigest=optionsHash(questionOptions);answers={};revealed=false;deadline=Date.now()+30000;currentVersion++;broadcastState();render()}
function doReveal(){if(!host||revealed)return;revealed=true;let vals=Object.values(answers).map(x=>x.trim().toLocaleLowerCase());let best=Math.max(0,...[...new Set(vals)].map(v=>vals.filter(x=>x===v).length));history.push({question,answers:Object.values(members).map(p=>({name:p.name,answer:answers[p.id]||'未作答'})),best});currentVersion++;broadcastState();render()}

function normalizeAnswer(v){return String(v??'').normalize('NFKC').trim().replace(/\s+/g,'').toLocaleLowerCase('zh-Hant')}
function resultData(){
  const names=[...new Set(history.flatMap(h=>h.answers.map(a=>a.name)))];
  const pairs=[];
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){

  }
  const highest=pairs.length?Math.max(...pairs.map(p=>p.rate)):null;

  let html='<div class="result-scroll"><table class="result-table"><thead><tr><th></th>'+names.map(n=>'<th>'+safe(n)+'</th>').join('')+'</tr></thead><tbody>';
  history.forEach((h,i)=>{const counts={};h.answers.forEach(a=>{let k=normalizeAnswer(a.answer);if(k&&a.answer!=='未作答')counts[k]=(counts[k]||0)+1});const vals=names.map(n=>h.answers.find(x=>x.name===n)?.answer||'未作答');const unanimous=names.length>=2&&vals.every(v=>v!=='未作答'&&normalizeAnswer(v)&&normalizeAnswer(v)===normalizeAnswer(vals[0]));html+='<tr'+(unanimous?' class="unanimous"':'')+'><td class="round-no">'+String(i+1).padStart(2,'0')+'</td>'+names.map((n,j)=>{let a=h.answers.find(x=>x.name===n),v=a?.answer||'—',k=normalizeAnswer(v);let cls=unanimous?'unanimous-answer '+(j===0?'first ':'')+(j===names.length-1?'last ':'')+(names.length===1?'only':''):(counts[k]>=2?'matched':'');return '<td class="'+cls+'">'+safe(v)+'</td>'}).join('')+'</tr>'});

  const list=(items,low=false)=>items.length?items.map(p=>'<div class="pair-row '+(low?'low':'')+'"><span>'+safe(p.a)+' × '+safe(p.b)+'</span><strong>'+Math.round(p.rate*100)+'%（'+p.same+'/'+p.total+'）</strong></div>').join(''):'<p class="muted tiny">尚無可比較的共同作答紀錄</p>';
  $('pairs').innerHTML='<h3>💜 最有默契的組合</h3>'+list(pairs.filter(p=>p.rate===highest))+'<h3>🌿 最沒默契的組合</h3>'+list(pairs.filter(p=>p.rate===lowest),true);
}

async function connect(isHost){if(isHost && new URLSearchParams(location.search).has('room'))return notice('這是房間邀請連結，請加入房間',true);me=clean($('nickname').value);if(!me)return notice('請先輸入暱稱',true);room=isHost?Array.from(crypto.getRandomValues(new Uint8Array(5)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join(''):clean($('roomInput').value).toUpperCase();if(!roomRegex.test(room))return notice('請輸入有效的 5 位房號',true);$('create').disabled=$('join').disabled=true;try{await QUESTIONS_READY;let res=await fetch('/api/cat-config');if(!res.ok)throw Error('讀取設定失敗');let config=await res.json();if(!config.url)throw Error('缺少原本的 SUPABASE_URL 設定');if(!config.publishableKey || !(config.publishableKey.startsWith('sb_publishable_') || config.publishableKey.startsWith('eyJ')))throw Error('請在 Vercel 設定 SUPABASE_PUBLISHABLE_KEY（公開金鑰）');client=supabase.createClient(config.url,config.publishableKey,{realtime:{params:{eventsPerSecond:10}}});host=isHost;hostId=host?myId:'';channel=client.channel('cat-sync-'+room,{config:{broadcast:{self:false},presence:{key:myId}}});channel.on('broadcast',{event:'hello'},({payload:p})=>{if(host){if(!members[p.from]){members[p.from]={id:p.from,name:clean(p.name)};currentVersion++;broadcastState();render()}else broadcastState()}}).on('broadcast',{event:'state'},({payload:p})=>{if(!host&&p?.hostId&&(!hostId||p.currentVersion>=currentVersion))hostId=p.hostId;applyState(p)}).on('broadcast',{event:'answer'},({payload:p})=>{if(!host||revealed||!round||Date.now()>=deadline||p.round!==round||!members[p.from]||Object.hasOwn(answers,p.from)||!questionOptions.includes(p.answer))return;answers[p.from]=p.answer;currentVersion++;if(Object.keys(answers).length>=Object.keys(members).length)doReveal();else{broadcastState();render()}}).on('broadcast',{event:'clock-ping'},({payload:p})=>{if(host&&p?.from&&Number.isFinite(p.clientSentAt))send('clock-pong',{target:p.from,clientSentAt:p.clientSentAt,hostReceivedAt:Date.now()})}).on('broadcast',{event:'clock-pong'},({payload:p})=>{if(host||p?.target!==myId||!Number.isFinite(p.clientSentAt)||!Number.isFinite(p.hostReceivedAt))return;let receivedAt=Date.now(),rtt=receivedAt-p.clientSentAt;if(rtt<0||rtt>10000)return;if(rtt<clockRtt){clockRtt=rtt;hostClockOffset=p.hostReceivedAt-(p.clientSentAt+receivedAt)/2;clockReady=true;updateTimer()}}).on('broadcast',{event:'finish'},()=>finish()).on('broadcast',{event:'sync'},()=>{if(host)broadcastState()}).on('presence',{event:'leave'},({leftPresences})=>{if(!host)return;for(let p of leftPresences){if(p.user_id&&p.user_id!==myId)delete members[p.user_id]}currentVersion++;broadcastState();render()}).subscribe(async status=>{if(status==='SUBSCRIBED'&&!connected){connected=true;await channel.track({user_id:myId,name:me});if(host){members[myId]={id:myId,name:me};render();notice('房間已建立，分享連結給朋友！')}else{show('setup',false);show('lobby',true);notice('正在等待房主同步…');await send('hello',{name:me});await send('sync',{});send('clock-ping',{clientSentAt:Date.now()});clockProbeHandle=setInterval(()=>{if(hostId)send('clock-ping',{clientSentAt:Date.now()})},3000);syncRetryHandle=setInterval(()=>{if(hostId&&lastSyncAt){clearInterval(syncRetryHandle);syncRetryHandle=null;return}send('hello',{name:me});send('sync',{})},1800);setTimeout(()=>{if(!lastSyncAt)notice('尚未收到房主同步，正在重試；請確認房號與房主是否在線',true)},4500)}}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')notice('即時連線失敗，請檢查 Supabase Realtime 設定',true)});}catch(e){notice(e.message,true);$('create').disabled=$('join').disabled=false}}
$('roomInput').addEventListener('input',()=>{$('roomInput').value=$('roomInput').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)});$('create').onclick=()=>connect(true);$('join').onclick=()=>connect(false);$('copy').onclick=async()=>{await navigator.clipboard.writeText(location.origin+'/cat-sync/?room='+room);notice('已複製邀請連結')};$('totalRounds').onchange=()=>{if(host&&!round){totalRounds=Number($('totalRounds').value);currentVersion++;broadcastState();render()}};$('start').onclick=()=>{if(host&&Object.keys(members).length>=2){totalRounds=Number($('totalRounds').value);used=[];history=[];round=0;newRound()}};$('next').onclick=()=>{if(host)newRound()};$('finish').onclick=()=>{if(host){send('finish',{});finish()}};timerHandle=setInterval(updateTimer,200);
$('download').onclick=()=>{
  const {names,pairs,highest,lowest}=resultData();
  const W=Math.max(850,170+names.length*180),scale=2,pad=45,numberW=48,colW=(W-pad*2-numberW)/Math.max(1,names.length);
  const ctx=document.createElement('canvas').getContext('2d');
  const measure=(txt,maxWidth,font)=>{ctx.font=font;const chars=Array.from(String(txt));let lines=[''];for(const ch of chars){let last=lines.length-1;if(ctx.measureText(lines[last]+ch).width>maxWidth&&lines[last])lines.push(ch);else lines[last]+=ch}return lines};
  const rowHeights=history.map(h=>Math.max(74,...names.map(n=>{let v=h.answers.find(x=>x.name===n)?.answer||'—';return 24+measure(v,colW-24,'bold 21px sans-serif').length*29})));
  const tops=[];let y=195;for(const h of rowHeights){tops.push(y);y+=h+10}
  const highs=pairs.filter(p=>p.rate===highest),lows=pairs.filter(p=>p.rate===lowest);
  const pairLine=(p)=>`${p.a} × ${p.b}　${Math.round(p.rate*100)}%（${p.same}/${p.total} 題）`;
  const pairRows=[...highs.map(p=>({text:pairLine(p),low:false})),...lows.map(p=>({text:pairLine(p),low:true}))];
  const pairY=y+65,footerY=pairY+90+pairRows.length*57+80;
  const H=Math.max(540,footerY);ctx.canvas.width=W*scale;ctx.canvas.height=H*scale;ctx.scale(scale,scale);
  ctx.fillStyle='#fbfafc';ctx.fillRect(0,0,W,H);
  function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function text(t,x,y,font,color,align='left'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
  function wrapped(t,x,cy,width,font,color,lineHeight){let ls=measure(t,width,font),start=cy-(ls.length-1)*lineHeight/2;ls.forEach((line,i)=>text(line,x,start+i*lineHeight,font,color,'center'))}
  text('我們的腦迴路',pad,62,'bold 36px sans-serif','#3f3a4c');text('共 '+history.length+' 輪 · '+history.filter(h=>h.best>=2).length+' 輪同詞相遇',W-pad,64,'19px sans-serif','#aaa3b2','right');
  names.forEach((n,i)=>wrapped(n,pad+numberW+(i+.5)*colW,142,colW-12,'bold 20px sans-serif','#8d8699',26));
  history.forEach((h,ri)=>{const counts={};h.answers.forEach(a=>{let k=normalizeAnswer(a.answer);if(k&&a.answer!=='未作答')counts[k]=(counts[k]||0)+1});const top=tops[ri],height=rowHeights[ri];const vals=names.map(n=>h.answers.find(x=>x.name===n)?.answer||'未作答');const unanimous=names.length>=2&&vals.every(v=>v!=='未作答'&&normalizeAnswer(v)&&normalizeAnswer(v)===normalizeAnswer(vals[0]));text(String(ri+1).padStart(2,'0'),pad+5,top+height/2,'19px sans-serif','#a9a1b4');if(unanimous)rect(pad+numberW+5,top,names.length*colW-10,height,18,'#fff0a8');names.forEach((n,i)=>{let v=h.answers.find(x=>x.name===n)?.answer||'—',k=normalizeAnswer(v),x=pad+numberW+i*colW+5,w=colW-10;if(!unanimous){rect(x,top,w,height,18,i%2===0?'#eee7f7':'#def2ec');if(counts[k]>=2){ctx.strokeStyle='#b99edc';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x+1.5,top+1.5,w-3,height-3,17);ctx.stroke()}}wrapped(v,x+w/2,top+height/2,w-24,'bold 21px sans-serif',unanimous?'#765300':i%2===0?'#765c98':'#548e7e',29)})});
  ctx.fillStyle='#e6e0ec';ctx.fillRect(pad,pairY-24,W-pad*2,1);
  let py=pairY;text('最有默契的成員組合',pad,py,'bold 24px sans-serif','#67518a');py+=39;
  if(!highs.length){text('尚無共同作答紀錄',pad+10,py,'19px sans-serif','#999');py+=48}else highs.forEach(p=>{rect(pad,py-18,W-pad*2,46,12,'#eee8f8');text(pairLine(p),pad+16,py+5,'19px sans-serif','#725991');py+=57});
  py+=15;text('最沒默契的成員組合',pad,py,'bold 24px sans-serif','#548b7c');py+=39;
  if(!lows.length){text('尚無共同作答紀錄',pad+10,py,'19px sans-serif','#999');py+=48}else lows.forEach(p=>{rect(pad,py-18,W-pad*2,46,12,'#e1f2ed');text(pairLine(p),pad+16,py+5,'19px sans-serif','#4d8676');py+=57});
  text('默契率＝同詞題數 ÷ 共同作答題數 · 同分並列',pad,H-35,'16px sans-serif','#aaa3b2');
  ctx.canvas.toBlob(blob=>{if(!blob)return notice('圖片產生失敗',true);const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='貓貓腦迴路-'+room+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)},'image/png');
};

const urlParams=new URLSearchParams(location.search);
