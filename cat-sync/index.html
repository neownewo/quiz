<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓貓腦迴路｜同詞相遇</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#263344;background:#f6f4fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:25px 16px 60px}.card{background:white;border-radius:22px;padding:23px;margin:16px 0;box-shadow:0 8px 30px #554c8c12}h1{font-size:30px;margin:12px 0}h2{margin-top:0}p{line-height:1.7}.muted{color:#777a89}.tiny{font-size:13px}input,button,select{font:inherit;padding:12px 14px;border-radius:12px}input,select{border:1px solid #d8d5e6;width:100%;margin:6px 0 12px}button{border:0;background:#6858cf;color:white;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#edeafb;color:#5544a5}.row{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}.pill{display:inline-block;border-radius:30px;background:#efeafd;color:#5d4ec0;padding:6px 12px;font-size:13px}.player{padding:9px 12px;border:1px solid #e5e0f4;border-radius:12px;margin:6px 0}.answer{background:#f6f4ff;border-radius:12px;padding:12px;margin:7px 0}.big{font-size:24px;font-weight:800}.error{color:#b32b48}.success{color:#217b54}#toast{min-height:22px}#share{word-break:break-all}#poster{background:linear-gradient(150deg,#f3efff,#fff7fb);padding:25px;border-radius:20px}#poster h2{color:#5343ad}
</style></head><body><main class="wrap"><span class="pill">🐾 貓貓腦迴路</span><h1>我們能想到同一個詞嗎？</h1><p class="muted">LINE 群組專屬題庫 · 各自手機同步作答 · 不儲存遊戲結果</p><div id="toast"></div>
<section id="setup" class="card"><h2>進入遊戲</h2><label>你的暱稱</label><input id="nickname" maxlength="18" placeholder="例如：貓貓"><div class="row"><button id="create">建立房間</button><button id="join">加入房間</button></div><label>加入房號（建立房間可留空）</label><input id="roomInput" maxlength="8" placeholder="8 位英數房號"></section>
<section id="lobby" class="card hide"><h2>房間 <span id="roomCode"></span></h2><p id="share" class="muted tiny"></p><button class="secondary" id="copy">複製邀請連結</button><h3>房間成員</h3><div id="members"></div><p class="muted tiny">房主保持頁面開啟。所有玩家加入後，由房主開始。</p><button id="start" class="hide">開始遊戲</button></section>
<section id="game" class="card hide"><span id="round" class="pill"></span><h2 id="question"></h2><div id="answerArea"><label>你第一時間想到的詞</label><input id="answer" maxlength="40" placeholder="輸入答案，送出後不能修改"><button id="submit">送出答案</button></div><p id="progress" class="muted"></p><div id="revealArea" class="hide"><h3>本輪結果</h3><div id="answers"></div><p id="match" class="big"></p><button id="next" class="hide">下一題</button><button class="secondary" id="finish">結束並製作結果圖</button></div></section>
<section id="end" class="card hide"><div id="poster"><h2>🐾 貓貓腦迴路同步報告</h2><p id="summary"></p><div id="history"></div><p class="tiny">一起想到同一個詞，就是我們的默契 ♡</p></div><button id="download">下載結果 PNG</button><button class="secondary" onclick="location.href='/cat-sync/'">重新開局</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const BANK=[
['inside','有人說「我要偷偷跟你們說」，你第一個想到什麼？'],['inside','群組突然安靜五分鐘，你覺得大家在幹嘛？'],['inside','有人打錯字，群組第一個會出現什麼反應？'],['inside','有人說「我有兩件事要說」，你第一個想到什麼？'],['inside','有人說「我先去尿尿」，下一個最可能出現的詞是？'],['inside','看到「吃爆米花」，你會聯想到什麼？'],['inside','聽到「瓜怎麼吃不完」，你想到什麼？'],['inside','提到「賽博抱抱」，你想到什麼？'],['inside','如果群組玩狼人殺，第一個想到的角色是？'],['inside','看到「阿嬤」，你第一個想到什麼？'],['inside','群組改名的話，你第一個會加進去的詞是？'],['inside','有人說「我快發瘋」，你第一個想到什麼？'],['inside','看到「腦袋超人」，你想到什麼？'],['inside','提到「軍師」，你第一個想到什麼？'],['inside','有人說「我不明白」，你會接什麼詞？'],['inside','聽到「我自我認同是一隻吉伊」，你想到什麼？'],['inside','群組有人突然喊「來」，你想到什麼？'],['inside','看到「好好笑」，你第一個聯想到誰或什麼？'],['inside','聽到「簡單點」，你第一個想到什麼？'],['inside','有人說「我有一件事情要宣布」，你第一個想到什麼？'],
['word','秦徹'],['word','祁煜'],['word','敖尹'],['word','沈星回'],['word','夏以晝'],['word','黎深'],['word','娃娃'],['word','痛包'],['word','燈箱'],['word','茶會'],['word','打卡'],['word','蕾絲'],['word','古風'],['word','扭蛋'],['word','抓寶'],['word','狼人殺'],['word','阿嬤'],['word','爆米花'],['word','貓貓'],['word','抱抱'],['word','綠茶'],['word','SABON'],['word','刈包'],['word','面相'],['word','飛雷神'],['word','吉伊'],['word','小狼'],['word','吃瓜'],['word','台南'],['word','荷蘭'],
['scenario','如果群組全員一起出國，第一個會發生什麼事？'],['scenario','大家突然被關在同一間密室，最先出現的物品是？'],['scenario','群組要開一間店，你覺得會賣什麼？'],['scenario','如果大家一起拍戀愛實境節目，節目名稱第一個詞是？'],['scenario','大家突然要辦一場茶會，最先準備什麼？'],['scenario','群組有人中樂透，第一個會買什麼？'],['scenario','如果群組變成遊戲公會，公會名稱會有什麼詞？'],['scenario','大家一起去逛動漫展，最先衝去哪裡？'],['scenario','如果大家一起拍電影，會是什麼類型？'],['scenario','大家突然要選吉祥物，你第一個想到什麼？'],['scenario','如果群組出現一隻貓，大家會給牠取什麼名字？'],['scenario','全員去唱歌，第一首歌會是什麼？'],['scenario','大家一起去夜市，第一個買什麼？'],['scenario','如果群組成為一間公司，最重要的部門叫什麼？'],['scenario','如果大家都穿越到古代，第一個會遇到什麼？'],['scenario','如果明天有線下聚會，最可能帶什麼周邊？'],['scenario','如果有人突然傳了 30 張照片，大家第一個會回什麼？'],['scenario','群組要設一個共同暗號，你第一個想到什麼？'],['scenario','如果群組有一個專屬節日，會慶祝什麼？'],['scenario','大家一起玩真心話大冒險，第一個會出現什麼詞？']
];
const $=id=>document.getElementById(id),show=(id,on=true)=>$(id).classList.toggle('hide',!on);
let client,channel,room='',me='',host=false,hostId='',myId=crypto.randomUUID(),members={},round=0,question='',answers={},revealed=false,history=[],used=[],currentVersion=0,connected=false;
const notice=(msg,bad=false)=>{$('toast').textContent=msg;$('toast').className=bad?'error':'success'};
const clean=s=>String(s||'').trim().slice(0,40),roomRegex=/^[A-Z0-9]{8}$/;
const pick=()=>{if(used.length>=BANK.length)used=[];let options=BANK.map((q,i)=>i).filter(i=>!used.includes(i));let idx=options[Math.floor(Math.random()*options.length)];used.push(idx);return BANK[idx][1]};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function send(event,payload){if(!channel)return;await channel.send({type:'broadcast',event,payload:{...payload,from:myId}})}
function renderMembers(){let arr=Object.values(members);$('members').innerHTML=arr.map(p=>'<div class="player">'+safe(p.name)+(p.id===hostId?' 👑':'')+'</div>').join('');show('start',host&&arr.length>=2);$('progress').textContent=Object.keys(answers).length+' / '+arr.length+' 人已作答';}
function broadcastState(){if(host)send('state',{members:Object.values(members),hostId,round,question,answers,revealed,history,currentVersion})}
function render(){show('setup',false);show('lobby',!round);show('game',!!round);$('roomCode').textContent=room;$('share').textContent=location.origin+'/cat-sync/?room='+room;renderMembers();if(!round)return;$('round').textContent='第 '+round+' 題';$('question').textContent=question;let submitted=Object.hasOwn(answers,myId);show('answerArea',!revealed&&!submitted);$('progress').textContent=revealed?'全員答案已揭曉':submitted?'已送出！等待其他人…':Object.keys(answers).length+' / '+Object.keys(members).length+' 人已作答';show('revealArea',revealed);show('next',revealed&&host);if(revealed){$('answers').innerHTML=Object.values(members).map(p=>'<div class="answer">'+safe(p.name)+'：<b>'+safe(answers[p.id]??'未作答')+'</b></div>').join('');let vals=Object.values(answers).map(x=>x.trim().toLocaleLowerCase());let count=Math.max(0,...[...new Set(vals)].map(v=>vals.filter(x=>x===v).length));$('match').textContent=count>=2?'✨ 最多 '+count+' 人同詞！':'這輪還沒相遇，下題再試！';}}
function applyState(p){if(host||p.hostId!==hostId||p.currentVersion<currentVersion)return;currentVersion=p.currentVersion;members=Object.fromEntries(p.members.map(x=>[x.id,x]));round=p.round;question=p.question;answers=p.answers;revealed=p.revealed;history=p.history;render()}
function newRound(){round++;question=pick();answers={};revealed=false;currentVersion++;broadcastState();render()}
function doReveal(){if(!host||revealed)return;revealed=true;let vals=Object.values(answers).map(x=>x.trim().toLocaleLowerCase());let best=Math.max(0,...[...new Set(vals)].map(v=>vals.filter(x=>x===v).length));history.push({question,answers:Object.values(members).map(p=>({name:p.name,answer:answers[p.id]||'未作答'})),best});currentVersion++;broadcastState();render()}
function finish(){show('lobby',false);show('game',false);show('end',true);$('summary').textContent='共玩 '+history.length+' 題，其中 '+history.filter(h=>h.best>=2).length+' 題出現同詞相遇！';$('history').innerHTML=history.map((h,i)=>'<p><b>第 '+(i+1)+' 題｜'+safe(h.question)+'</b><br>'+h.answers.map(a=>safe(a.name)+'：'+safe(a.answer)).join(' ／ ')+'</p>').join('');}
async function connect(isHost){me=clean($('nickname').value);if(!me)return notice('請先輸入暱稱',true);room=isHost?Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join(''):clean($('roomInput').value).toUpperCase();if(!roomRegex.test(room))return notice('請輸入有效的 8 位房號',true);$('create').disabled=$('join').disabled=true;try{let res=await fetch('/api/cat-config');if(!res.ok)throw Error('讀取設定失敗');let config=await res.json();if(!config.url||!config.anonKey)throw Error('缺少 SUPABASE_ANON_KEY 設定');client=supabase.createClient(config.url,config.anonKey,{realtime:{params:{eventsPerSecond:10}}});host=isHost;hostId=host?myId:'';channel=client.channel('cat-sync-'+room,{config:{broadcast:{self:false},presence:{key:myId}}});channel.on('broadcast',{event:'hello'},({payload:p})=>{if(host){if(!members[p.from]){members[p.from]={id:p.from,name:clean(p.name)};currentVersion++;broadcastState();render()}else broadcastState()}}).on('broadcast',{event:'state'},({payload:p})=>{if(!host&&!hostId)hostId=p.hostId;applyState(p)}).on('broadcast',{event:'answer'},({payload:p})=>{if(!host||revealed||!round||!members[p.from]||Object.hasOwn(answers,p.from))return;answers[p.from]=clean(p.answer);currentVersion++;if(Object.keys(answers).length>=Object.keys(members).length)doReveal();else{broadcastState();render()}}).on('broadcast',{event:'finish'},()=>finish()).on('broadcast',{event:'sync'},()=>{if(host)broadcastState()}).on('presence',{event:'leave'},({leftPresences})=>{if(!host)return;for(let p of leftPresences){if(p.user_id&&p.user_id!==myId)delete members[p.user_id]}currentVersion++;broadcastState();render()}).subscribe(async status=>{if(status==='SUBSCRIBED'&&!connected){connected=true;await channel.track({user_id:myId,name:me});if(host){members[myId]={id:myId,name:me};render();notice('房間已建立，分享連結給朋友！')}else{show('setup',false);show('lobby',true);notice('正在等待房主同步…');send('hello',{name:me});send('sync',{});setTimeout(()=>{if(!hostId)notice('尚未收到房主回應，請確認房號與房主是否在線',true)},4500)}}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')notice('即時連線失敗，請檢查 Supabase Realtime 設定',true)});}catch(e){notice(e.message,true);$('create').disabled=$('join').disabled=false}}
$('create').onclick=()=>connect(true);$('join').onclick=()=>connect(false);$('copy').onclick=async()=>{await navigator.clipboard.writeText(location.origin+'/cat-sync/?room='+room);notice('已複製邀請連結')};$('start').onclick=()=>{if(host&&Object.keys(members).length>=2)newRound()};$('submit').onclick=()=>{let answer=clean($('answer').value);if(!answer)return notice('請先輸入答案',true);$('answer').value='';if(host){answers[myId]=answer;currentVersion++;if(Object.keys(answers).length===Object.keys(members).length)doReveal();else{broadcastState();render()}}else{answers[myId]=answer;render();send('answer',{answer})}};$('next').onclick=()=>{if(host)newRound()};$('finish').onclick=()=>{if(host)send('finish',{});finish()};
$('download').onclick=()=>{let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),W=1000,pad=58,lineH=36,lines=['貓貓腦迴路同步報告','共 '+history.length+' 題｜'+history.filter(h=>h.best>=2).length+' 題同詞相遇'];for(let [i,h] of history.entries()){lines.push('');lines.push('第 '+(i+1)+' 題：'+h.question);for(let a of h.answers)lines.push(a.name+'：'+a.answer)}let wrapped=[];for(let line of lines){let s='';for(let ch of line){if([...s].length>=29&&s){wrapped.push(s);s=''}s+=ch}wrapped.push(s)}canvas.width=W;canvas.height=Math.max(380,110+wrapped.length*lineH);ctx.fillStyle='#f8f4ff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#4d4089';ctx.font='bold 26px sans-serif';wrapped.forEach((l,i)=>ctx.fillText(l,pad,70+i*lineH));canvas.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='貓貓腦迴路-'+room+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
const urlRoom=new URLSearchParams(location.search).get('room');if(urlRoom){$('roomInput').value=urlRoom.toUpperCase();notice('輸入暱稱後，按「加入房間」')}
</script></body></html>
